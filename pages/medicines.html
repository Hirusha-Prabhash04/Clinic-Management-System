<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="header-flex">
            <h1>Medicine Inventory</h1>
            <p>Manage and track your medicine stock easily.</p>
        </header>

        <section class="table-container">
            <table>
                <tr>
                    <th>Medicine Name</th>
                    <th>Stock</th>
                    <th>Expiry Date</th>
                </tr>
                <tr>
                    <td>Paracetamol</td>
                    <td>120</td>
                    <td>2027-05-15</td>
                </tr>
                <tr>
                    <td>Amoxicillin</td>
                    <td>75</td>
                    <td>2026-11-20</td>
                </tr>
                <tr>
                    <td>Vitamin C</td>
                    <td>200</td>
                    <td>2028-01-10</td>
                </tr>
            </table>
        </section>
    </main>

</body>
</html>
